<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Good Vibes Barber Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">

    <section class="py-20 text-center bg-black text-white">
        <h1 class="text-5xl font-bold mb-4">Good Vibes Barber Shop</h1>
        <p class="text-xl text-yellow-500">Zero Stress. Perfect Fades.</p>
    </section>

    <section id="booking" class="py-16 max-w-xl mx-auto px-4">
        <div class="bg-white p-8 rounded-2xl shadow-lg border border-gray-200">
            <h2 class="text-3xl font-bold mb-6 text-center">Book Your Appointment</h2>
            
            <form action="https://formspree.io/f/your-id" method="POST" class="space-y-4">
                <div>
                    <label class="block font-bold mb-1">Your Name</label>
                    <input type="text" name="name" required class="w-full p-3 border rounded-lg">
                </div>
                <div>
                    <label class="block font-bold mb-1">Email Address</label>
                    <input type="email" name="email" required class="w-full p-3 border rounded-lg">
                </div>
                <div>
                    <label class="block font-bold mb-1">Service</label>
                    <select name="service" class="w-full p-3 border rounded-lg">
                        <option>Standard Haircut</option>
                        <option>Student Haircut</option>
                        <option>Beard Trim</option>
                    </select>
                </div>
                <button type="submit" class="w-full bg-black text-white py-4 rounded-lg font-bold hover:bg-yellow-600 transition">
                    Send Booking Request
                </button>
            </form>
        </div>
    </section>

</body>
</html>
